<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dairenin Dışından Kırpma - clip-path</title>
    <style>
        .circle-crop {
            width: 300px;
            height: 300px;
            background: url('ornek-resim.jpg') center/cover no-repeat; /* veya istenilen arka plan rengi */
            /* Dairenin dışını kırpmak için clipping alanını daire olarak ayarlıyoruz */
            clip-path: circle(50% at 50% 50%);
        }
    </style>
</head>
<body>
    <div class="circle-crop"></div>
</body>
</html>
